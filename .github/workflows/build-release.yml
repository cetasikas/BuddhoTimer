name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.26.1
          name: "Buddho Timer v2.26.1"
          body: |
            ## 🍃 Buddho Meditation Timer v2.26.1

            ### Falling Leaves Polish
            - **Consistent leaf colour**: Resting leaves now use the exact same ambient opacity as falling ones — no more jarring brightness jump when a leaf touches down
            - **Proper stacking**: Leaves now physically land *on top of* each other using the correct leaf-height step (0.035 normalised vs the old 0.013), so the pile looks real instead of leaves floating/merging inside each other
            - **Spreads across the full bottom**: Tighter support radius (one leaf-width) means only leaves directly below count as support, preventing leaves from appearing suspended in mid-air
            - **Slower, more meditative accumulation**: Initial leaves are spread 2.2× higher above the screen so the first landing wave takes ~80 s instead of 30 s

            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
