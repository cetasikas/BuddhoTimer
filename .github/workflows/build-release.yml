name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.7.0
          name: "Buddho Timer v2.7.0"
          body: |
            ## 🪷 Buddho Meditation Timer v2.7.0
            
            - **🍃 Spacious Setup Screen Layouts**: Redesigned vertical hierarchy across Meditation and Box Breathing setup screens for a balanced, expansive, and luxurious zen feel.
            - **🎋 Bespoke Theme-Specific Breathing Animations**:
              - *Moonlit Bamboo*: Segmented living bamboo stalk that grows upward and unrolls leaves with each inhale, sways gently on hold, and settles calmly on exhale.
              - *Golden Lotus*: Sacred blooming lotus flower seated on a floating lily pad with expanding water ripple rings.
              - *Sakura Twilight*: 5-petal notched cherry blossom with glowing stamen core and sprig branch that blooms with twilight magenta-rose glow.
            - **🔍 Redesigned Box Breathing Pattern Selector**: Distinct cards with category badges (`[FOCUS & STRESS RESET]`, `[DEEP SLEEP & RELAXATION]`, `[HEART COHERENCE]`, `[BEGINNER FRIENDLY]`) and color-coded visual phase timing chips (`[4s In] [4s Hold] [4s Out] [4s Hold]`).
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
