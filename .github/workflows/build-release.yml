name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.0
          name: "Buddho Timer v2.1.0"
          body: |
            ## 🪷 Buddho Meditation Timer v2.1.0
            
            - **🌿 Calming Sage Green Theme**: Softened the entire app palette from teal to an authentic, tranquil Plum Village Sage Green & Forest Moss aesthetic.
            - **🪵 Wider, Highly Tactile Zen Branch Slider**: Greatly expanded touch target height (54dp) and branch width with larger pebble thumb for effortless, fluid dragging and tapping.
            - **🍃 Subtle Organic Leaf Breathing Glow**: Restored peaceful ambient brightness with a gentle, translucent sage breathing halo around floating leaves during meditation.
            - **🍂 3-Tier Multi-Layer Leaf Stacking**: Enhanced floor accumulation into a rich, natural mound of resting leaves that stacks and builds progressively as meditation time elapses.
            - **100% Offline & Private**: Zero internet permissions, no tracking, pure serenity.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
