name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.0
          name: "Buddho Timer v1.4.0"
          body: |
            ## 🪷 Buddho Meditation Timer v1.4.0
            
            - **🧘 Pristine Minimalist Timer Screen**: Pure focus on the target duration timer with Samadhi Overrun continuous timing.
            - **🌸 Organic Hypnotic Breathing Flower**: Realistic expanding/contracting blooming mandala visualizer with sweeping progress arc and spacious non-overlapping typography.
            - **📚 Structured Wisdom Guidance**: Level tabs for Beginner, Intermediate, and Advanced practice steps.
            - **⚙️ Centralized Settings**: Meditation chime selectors and Box Breathing relief tools moved into preferences.
            - **🔔 HD Sound Synthesizer Engine**: Multi-harmonic Tibetan Singing Bowl, Zen Bronze Bell, Ting-Sha Cymbals, Woodblock Moktak, and Silent Retreat mode.
            - **🌑 Zen OLED Deep Black Ambient Mode**: Pitch-black distraction-free clock display for night sits.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
