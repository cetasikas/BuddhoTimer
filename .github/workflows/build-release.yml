name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.9.0
          name: "Buddho Timer v1.9.0"
          body: |
            ## 🪷 Buddho Meditation Timer v1.9.0
            
            - **🍃 Pure Minimalist Timer Layout**: Removed header clutter for maximum serenity and calm.
            - **⚪ Minimal Slate/Grey Slider**: Redesigned sleek slider in neutral moonlit slate tones with organic circular thumb and leaf flutter feedback.
            - **🍂 Realistic Leaf Textures & Breathing Glow Aura**: Detailed primary and secondary leaf veins, smooth 5-second breathing halo oscillation during meditation, and calming leaf accumulation along the floor of the screen.
            - **🌊 Serene Blue/Teal Theme & Enlarged Digits**: Cohesive moonlit teal aesthetic across Active Session, circular progress arc, and Settings, with larger high-contrast timer numbers.
            - **📖 Ajahn Brahm's 4-Stage Meditation Guide**: Updated "Start Here" topic card to feature the foundational stages of letting go, silent awareness, and joyful stillness.
            - **⚙️ Redesigned Settings & Seamless Back Navigation**: Unified teal theme, dedicated Back buttons on Settings and Wisdom, and removed redundant Box Breathing card from settings.
            - **✨ First-Launch & On-Demand Tutorial Walkthrough**: Interactive 4-step quick guide introducing core features and offering one-tap DND / Battery permission setup, also accessible from Settings.
            - **Zero Internet Permissions**: 100% offline, privacy-first meditation companion.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
