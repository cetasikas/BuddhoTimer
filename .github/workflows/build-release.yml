name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.23.0
          name: "Buddho Timer v2.23.0"
          body: |
            ## 🪷 Buddho Meditation Timer v2.23.0
            
            - **🍃 Seamless Background & App Switch Persistence**:
              - Leaf stacking now dynamically synchronizes with elapsed meditation seconds upon resuming or switching apps, catching up and retaining the exact ground floor state.
            - **🍂 Organic Aerodynamic Gliding Physics**:
              - Replaced vertical plumb-line descent with wide, natural diagonal sweeps, aerodynamic banking tilts, and 3D tumbling flutter.
            - **🧘 Box Breathing Overview Distinction**:
              - Box Breathing overview screen now displays ambient floating particles without bottom leaf stacking.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
