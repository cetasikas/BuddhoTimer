name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.4.2
          name: "Buddho Timer v2.4.2"
          body: |
            ## 🪷 Buddho Meditation Timer v2.4.2
            
            - **🍃 Dynamic Spiral Orbit & Expanded Glow Halos**: Leaves in Box Breathing now organically swirl and expand along living logarithmic spiral orbits in synchrony with your breath ($0.22 \leftrightarrow 1.0$), with expansive pulsating glowing borders.
            - **🌌 Soft Atmospheric Central Nebula**: Replaced the center core with an ultra-soft, diffused multi-stop ambient nebula with zero harsh solid dots.
            - **🌑 Tap to Blackout Screen (Stealth Mode)**: Removed the old LED mode in favor of seamless full-screen AMOLED pure black stealth mode—simply tap anywhere during meditation to turn the screen completely dark, and tap again to wake.
            - **🔔 Mindfulness Interval Bell Setting**: Added customizable periodic interval chimes (Off, 1m, 2m, 3m, 5m, 10m, 15m, 20m, 30m) to gently anchor your awareness back to the present moment.
            - **📱 Keep Screen Awake Toggle**: Configurable setting to keep the screen active during meditation and box breathing practice without sleeping.
            - **⚙️ Complete Settings Persistence**: All preferences, intervals, toggles, and leaf configurations persist reliably across app launches.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
