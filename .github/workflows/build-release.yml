name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.7
          name: "Buddho Timer v2.5.7"
          body: |
            ## 🪷 Buddho Meditation Timer v2.5.7
            
            - **🍃 Meditative, Peaceful Falling Leaves Background**: Replaced rapid swirling with a gentle, slow downward drift and soft horizontal breeze across the screen on slider movement, completely eliminating edge rushing and unnatural upward motions.
            - **📐 Full & Balanced Box Breathing Setup**: Added a 2-row preset grid (Row 1: 2m, 3m, 5m, 7m; Row 2: 10m, 15m, 20m, 30m) and an enriched pattern centerpiece card with visual phase cadence chips (e.g. `[ 4s Inhale ]` `[ 4s Hold ]` `[ 4s Exhale ]` `[ 4s Hold ]`), achieving perfect height and aesthetic symmetry with the meditation setup.
            - **🔽 Compact Dropdown Selection**: Breathwork patterns and settings effortlessly fit on any device screen with zero scrolling required.
            - **🔄 Mid-Session Breathwork Pattern Switching**: Change breathing patterns on the fly via the top interactive pill.
            - **📝 Unified Post-Session Reflection Overview**: Breathwork sessions seamlessly navigate to full session overview with reflection notes, mood selection, and quote cards.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
