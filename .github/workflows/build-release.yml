name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.2
          name: "Buddho Timer v2.5.2"
          body: |
            ## 🪷 Buddho Meditation Timer v2.5.2
            
            - **🌬️ Integrated Box Breathing Mode Toggle**: Switched Box Breathing into a dedicated inline toggle directly on the Timer page right below "Continue Past Target Time". When toggled ON, the main action button dynamically becomes "Begin Box Breathing" with seamless 4-4-4-4 visual breathwork.
            - **🧘 Clear Intuitive Naming**: Replaced confusing terms like "Samadhi Overrun" with clear, intuitive language (**"Continue Past Target Time"** on Timer and **"Extended Time"** in session tracking).
            - **🍃 Rich Vibrant Leaf Pigments in Box Breathing**: Theme leaf colors (*Moonlit Bamboo Teal, Golden Lotus Amber, Sakura Twilight Rose*) shine through with full saturation framed by a soft ethereal white edge aura.
            - **✨ Streamlined 3-Step Setup Tour**: Concise setup onboarding showcasing all new capabilities with zero clutter.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
