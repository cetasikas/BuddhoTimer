name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.3
          name: "Buddho Timer v2.5.3"
          body: |
            ## 🪷 Buddho Meditation Timer v2.5.3
            
            - **🔄 Seamless Top Mode Switcher**: Added symmetric mode switchers in the header of both the Meditation Timer and Box Breathing screens (`[ 🧘 Meditation | 🌬️ Box Breathing ]`) allowing instantaneous 1-tap switching between sitting meditation and visual breathwork.
            - **📐 Fixed Duration Presets Grid**: Replaced cramped presets with a balanced 2-row symmetric layout (Row 1: 5m, 10m, 15m, 20m; Row 2: 25m, 30m, 45m, 60m), completely resolving truncation and black block clipping.
            - **🗂️ Ultra-Compact Accordion Settings Menu**: Refactored the settings screen into sleek expandable accordion cards with live status badges and smooth animated dropdown disclosures.
            - **🎯 Centered Tutorial Permission Buttons**: Perfectly centered DND and Battery button labels on the onboarding permission step.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
