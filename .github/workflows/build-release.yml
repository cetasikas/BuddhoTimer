name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.25.0
          name: "Buddho Timer v2.25.0"
          body: |
            ## 🪷 Buddho Meditation Timer v2.25.0
            
            - **🍂 Tactile Multi-Layer Leaf Stacking & Elevation Physics**:
              - Leaves now dynamically stack and pile on top of each other at the bottom of the screen with organic heightmap elevation and mound slope contouring.
              - Enlarged leaf particles by ~50% (28–38dp) with contact drop shadows, distinct stems/ribs, and crisp contours for clear depth separation as leaves touch and stack.
              - Calibrated a steady, meditative leaf fall cadence (~25s descent) so visual progress accumulates noticeably throughout meditation sessions.
            - **🔑 Universal Permanent Signing Keystore**:
              - Permanent release keystore ensures all future updates install directly over existing versions.
            - **🛡️ Bulletproof Stability & Box Breathing Polish**:
              - Thread-safe particle system, AudioTrack leak prevention, distraction-free Box Breathing, and enlarged bottom session timers.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
