name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.3.5
          name: "Buddho Timer v2.3.5"
          body: |
            ## 🪷 Buddho Meditation Timer v2.3.5
            
            - **🍃 Multi-Tier Leaf Pile Stacking**: Leaves now realistically accumulate and stack upward in multiple organic tiers (`Base`, `Mid`, `Upper Mound`, `Top Peak`) with rich layered depth shading.
            - **⚙️ Settings Option for Practice Leaves**: Added a toggle switch in Settings to enable/disable falling leaves during active meditation.
            - **🍂 Configurable Leaf Density**: Added interactive selectors to choose particle count during practice: Light (8), Gentle (16), Lush (28), Breeze (42).
            - **🪶 Session Duration Synchronization**: Summary screen renders the exact leaf mound accumulated during the meditation practice.
            - **🌬️ Autumn Wind Blow-Away Animation**: Saving or discarding a session sweeps resting leaves into a gentle swirling autumn breeze that dissolves into the sky before returning to the main menu.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
