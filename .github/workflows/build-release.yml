name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.6.0
          name: "Buddho Timer v2.6.0"
          body: |
            ## 🪷 Buddho Meditation Timer v2.6.0
            
            - **🍃 Decluttered & Spacious Setup Screens**: Removed clutter with single-row essential presets, expansive tranquil padding, and clean typography for pure zen focus.
            - **🎋 Authentic High-Definition Botanical Breathing Species**: Complete visual overhaul of breathwork animations:
              - *Moonlit Bamboo*: Multi-leaf authentic bamboo branch sprigs with joint node stems and lanceolate foliage.
              - *Golden Lotus*: Concentric sacred lotus flower petals blooming open with golden vein filigree.
              - *Sakura Twilight*: 5-petal cherry blossom florets and notched sakura petals.
            - **🔍 Crystal-Clear Breathwork Method Differentiator**: High-contrast method badges (`[ EQUAL 4-PHASE BOX ]`, `[ DEEP SLEEP & RELAX ]`, `[ HEART COHERENCE ]`, `[ GENTLE BEGINNER ]`) with explicit step-by-step cadence breakdowns.
            - **💖 Moved Donate Button to Settings**: Placed the Support / Donate action in the top right of the Settings screen.
            - **🧘 Pure Ambient Falling Leaves**: Background leaves fall in a peaceful, natural, serene vertical drift uncoupled from dragging.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
