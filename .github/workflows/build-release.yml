name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.13.0
          name: "Buddho Timer v2.13.0"
          body: |
            ## 🪷 Buddho Meditation Timer v2.13.0
            
            - **🍃 Ambient Falling Leaves in Breathwork**: Theme-matched background leaves and petals gently drift and fall behind the Ensō circle.
            - **⭕ Screen-Spanning Ensō Circle**: Expanded Ensō radius to make full use of screen real estate.
            - **✨ Prominent Hero Typography**: Enlarged countdown seconds (68sp), bold phase titles (20sp), and larger session elapsed time (15sp).
            - **📜 Clean Instruction Placement**: Positioned the breathing instructions outside the circle to avoid any cutoff.
            - **🌿 Top Anchor Leaf on Hold-Empty**: The top apex leaf remains gracefully resting in place at the top of the circle during hold-empty, seamlessly launching each new breath.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
