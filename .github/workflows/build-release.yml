name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "Buddho Timer v2.0.0"
          body: |
            ## 🪷 Buddho Meditation Timer v2.0.0
            
            - **🪵 Minimal Organic Zen Branch Slider**: Custom minimalist slider styled as a living bamboo/tree branch with organic nodes, living teal active gradient, dormant moonlit slate stem, and a delicate sprouting leaf bead thumb with zero yellow.
            - **✨ Noticeable Breathing Glow Halo**: Luminous triple-layer cyan-teal breathing halo aura oscillating gently around leaves during meditation sits.
            - **🍃 Progress-Coinciding Leaf Accumulation**: Falling leaves settle naturally into a serene, growing bed along the floor of the screen that dynamically reflects elapsed practice progress.
            - **🌊 Universal Serene Teal Theme**: Cohesive moonlit teal aesthetic completely unified across Practice Complete (Session Summary), Mood Selector, Markdown Toolbar, and History records.
            - **100% Offline & Private**: Zero internet permissions, no tracking, built for deep peace and stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
