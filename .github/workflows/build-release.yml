name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.11.0
          name: "Buddho Timer v2.11.0"
          body: |
            ## 🪷 Buddho Meditation Timer v2.11.0
            
            - **⭕ Sacred Zen Ensō Botanical Breath Visualizer**:
              - *Inhale*: Leaves and petals sweep smoothly clockwise from the top, forming an organic Zen circle (Ensō).
              - *Hold Full*: The complete Ensō garland glows with soft harmonic breathing illumination.
              - *Exhale*: The circle gently un-makes and dissolves itself, with leaves floating peacefully into the mist.
              - *Hold Empty*: Pure tranquil stillness (Śūnyatā / Emptiness) before the next breath.
            - **🎋 Bespoke Botanical Themes**:
              - *Moonlit Bamboo*: Organic jade & emerald bamboo leaves forming a calligraphic bamboo wreath.
              - *Sacred Lotus*: Golden & coral lotus petals layered in a radiant sacred garland.
              - *Sakura Twilight*: Delicate pink cherry florets and notched petals swirling in a sakura wreath.
            - **📱 Discard Button Padding Refinement**: Improved layout and balanced padding on the completion reflection screen.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
