name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.9
          name: "Buddho Timer v2.5.9"
          body: |
            ## 🪷 Buddho Meditation Timer v2.5.9
            
            - **🎋 Distinct Theme Botanicals in Box Breathing**: Transformed Box Breathing animations to render distinct, theme-authentic plants:
              - *Moonlit Bamboo*: Slender lanceolate bamboo foliage blades with culm joint sheath notches and parallel venation.
              - *Golden Lotus*: Broad cupped sacred water lily petals with glowing golden ribbing.
              - *Sakura Twilight*: Delicate notched cherry blossom petals with heart-cleft apex and stamen glow.
            - **✨ Enhanced Tactile Slider Animations**: Added dynamic expanding radiant halo aura and sprout bloom on the branch slider thumb during drag.
            - **🧘 Minimal Meditating Buddha Outline Logo & "Buddho Timer" Branding**: Clean vector Enso outline logo of the seated Buddha in meditation.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
