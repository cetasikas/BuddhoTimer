name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.3.2
          name: "Buddho Timer v2.3.2"
          body: |
            ## 🪷 Buddho Meditation Timer v2.3.2
            
            - **🍃 True Ground Sticking & Stacking Physics**: Falling leaves now genuinely land and stick to the ground when meditating, building up natural layers across the bottom.
            - **📊 Session Overview Leaf Mound**: The meditation summary screen shows the stacked mound of fallen leaves from the practice.
            - **🌬️ Unobstructed Zen Blooming Leaf Visualizer**: Cleanly separated breath instructions below the visualizer, collapsed pattern options, and enlarged blooming leaves with fluid ease-in/ease-out motion.
            - **▶️ Clean Action Buttons**: Fixed text wrapping so "Begin Practice" never clips on any screen.
            - **🍂 Immediate Initial Fall in Timer Screen**: Guaranteed continuous hardware clock ensuring leaves drift immediately from app launch.
            - **100% Offline & Private**: Zero tracking, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
