name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.24.1
          name: "Buddho Timer v2.24.1"
          body: |
            ## 🪷 Buddho Meditation Timer v2.24.1
            
            - **🔑 Universal Permanent Signing Keystore**:
              - All release and debug APKs are now signed with a dedicated repository release keystore with full APK Signature Scheme v2/v3 support.
              - Resolves Android signature conflict / "can't install" installation errors. *(Note: If updating from an earlier build, uninstall the previous version once, and all future updates will install seamlessly without uninstalling).*
            - **🛡️ Bulletproof Stability & Crash Prevention**:
              - Fixed `ConcurrentModificationException` during meditation and screen transitions by making particle animation state thread-safe and immune to concurrent iterations.
              - Fixed native `AudioTrack` resource leak, ensuring chime audio tracks are cleanly closed after playback.
            - **🌬️ Distraction-Free Box Breathing**:
              - Removed ambient background drifting leaves in Box Breathing mode to keep focus entirely on the central living Ensō breathwork.
              - Enlarged and enhanced visibility of bottom phase instructions and session progress timer for effortless glanceability.
            - **📦 ProGuard Hardening**:
              - Added explicit ProGuard keep rules for all local database DAOs and service handlers.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
