name: Build & Release Android APK

# Manual dispatch only to prevent exhausting GitHub Actions quota
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug, Release APKs & Google Play App Bundle (AAB)
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Play Store AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-PlayStore-AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.ref_name }}
          name: "Buddho Timer ${{ github.ref_name }}"
          body: |
            ## 🍃 Buddho Meditation Timer ${{ github.ref_name }}

            ### Release Notes
            - **Official Sacred Lotus & Unalome Emblem**: High-resolution branding across launcher icons, store assets, and timer page header.
            - **Google Play Ready**: Includes signed Android App Bundle (`.aab`) for Play Store distribution.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
