name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.15.0
          name: "Buddho Timer v2.15.0"
          body: |
            ## 🪷 Buddho Meditation Timer v2.15.0
            
            - **🍂 Natural Central Leaf Pile Accumulation**:
              - Falling leaves drift gently inward with a soft central breeze and settle on top of each other in a realistic Gaussian botanical mound.
              - The pile grows and deepens naturally as meditation time elapses.
            - **🧘 Seamless Persistence on Overview Screen**:
              - The accumulated leaf pile remains sitting peacefully at the bottom of the Practice Summary / Overview screen.
              - When saving or discarding the session, the pile gracefully blows away in a peaceful gust of wind upon screen exit.
            - **🌸 Realistic Sakura Cherry Blossoms**:
              - Authentic elongated ovate petals with delicate tip clefts and natural floret dispersal.
            - **⏰ Random Waking-Hour Meditation Reminders (8 AM – 9 PM)**:
              - Surprise mindfulness reminder delivered during active waking hours.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
