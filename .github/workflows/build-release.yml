name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.9.0
          name: "Buddho Timer v2.9.0"
          body: |
            ## 🪷 Buddho Meditation Timer v2.9.0
            
            - **🫧 Calm-Inspired Radiant Breathing Bubble**: Smooth, hypnotic multi-layered luminous breathing orb with diffused ambient aura, ethereal pulse rings, and glassmorphic reflection.
            - **🎋 Bespoke Theme Botanical Particle Fields**:
              - *Moonlit Bamboo*: Jade & emerald glowing bamboo leaves with spine details fanning outward along the expanding bubble perimeter.
              - *Sacred Lotus*: Concentric golden & coral lotus mandala tiers blooming wide with the breath bubble.
              - *Sakura Twilight*: Swirling 5-petal cherry blossom florets and notched sakura petals expanding with radiant stamen core.
              - *Screen-Bounded Ambient Particles*: Floating leaves and petals gracefully drifting within screen boundaries.
            - **📱 Zero-Scroll Setup Screen Fitting**: Clean, unconstrained single-screen layout with decluttered pattern dropdown.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
