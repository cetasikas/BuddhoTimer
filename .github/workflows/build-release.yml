name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8.0
          name: "Buddho Timer v1.8.0"
          body: |
            ## 🪷 Buddho Meditation Timer v1.8.0
            
            - **✨ Single-Page Compact Timer Layout**: Optimized vertical layout so all controls, duration display, and the "Begin Practice" button fit comfortably within a single view.
            - **🍃 Plum Village "Buddho Timer" Typography**: Elegant calligraphy serif title styling.
            - **🧘 Quick Box Breathing Access**: Dedicated minimal quick-launch pill on the main timer screen.
            - **🍂 Animated Slider & Glowing Leaves Aura**: Smooth leaf flutter animations on duration adjustment, and luminous edge glow halo around falling leaves during active meditation.
            - **📖 Simplified & Expandable Wisdom Guides**: Clean, approachable topic cards covering the basics of meditation, breath awareness, Buddho mantra, walking meditation, overcoming restlessness/sleepiness, and loving-kindness.
            - **🔔 Soothing Additive Audio Synthesis**: Mellow Tibetan Singing Bowl, temple bell, ting-sha, and woodblock with gentle attack envelopes for zero harsh clicks or startling sounds.
            - **⚙️ Refined Settings Layout**: Fixed sound preview button and horizontal permission action pills.
            - **🌌 Universal Plum Village Moonlit Atmosphere**: Serene dark bamboo backdrop with subtle falling leaves across all screens.
            - **Zero Internet Permissions**: 100% offline, privacy-first meditation companion.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
