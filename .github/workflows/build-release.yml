name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.2.1
          name: "Buddho Timer v2.2.1"
          body: |
            ## 🪷 Buddho Meditation Timer v2.2.1
            
            - **🍃 Blank Start & Even Golden-Ratio Leaf Accumulation**: Meditation screen starts with a clean, unaccumulated floor that slowly and evenly fills across the full width of the screen using low-discrepancy dispersion, eliminating right-side clustering.
            - **✨ Crisp Natural Meditation Leaf Aesthetics**: Aligned leaf rendering during meditation with the exact crisp, organic styling from the main timer screen with a soft, peaceful breathing aura.
            - **🌸 Theme-Specific Falling Particles & Blossoms**:
              - *Moonlit Bamboo*: Slender bamboo & Bodhi leaves with visible stem and natural side veins.
              - *Sacred Lotus*: Wide curved lotus petals plus occasional 8-petal floating lotus blossoms with golden stamen cores.
              - *Sakura Twilight*: Iconic cleft-notched cherry blossom petals plus occasional drifting 5-petal sakura flowers.
            - **100% Offline & Private**: Zero tracking, zero internet permissions, built for deep peace and stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
