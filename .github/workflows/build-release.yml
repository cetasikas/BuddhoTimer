name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.3.3
          name: "Buddho Timer v2.3.3"
          body: |
            ## 🪷 Buddho Meditation Timer v2.3.3
            
            - **🍃 Natural Touchdown & Cushioning Physics**: Falling leaves now smoothly decelerate and cushion upon touching the ground or leaf mound rather than snapping into place.
            - **🍂 Natural Resting Angles & Contour Stacking**: Resting leaves settle horizontally, align to the local slope of accumulated mounds, and feature layered depth with soft ambient micro-sway.
            - **🌬️ Silky Smooth Box Breathing Visualizer**: Replaced repeating loop timers with continuous monotonic frame synchronization, eliminating stutter and phase boundary discontinuities.
            - **✨ Minimal Unboxed Breathing Typography**: Breathing phase names, instructions, and countdowns now float cleanly and minimally below the visualizer with smooth animated crossfades.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
