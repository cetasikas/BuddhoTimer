name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.10.0
          name: "Buddho Timer v2.10.0"
          body: |
            ## 🪷 Buddho Meditation Timer v2.10.0
            
            - **✨ Dynamic Calm Milestone Notches & Traveling Half-Circle Bead**: Smooth orbital indicator with capsule notches marking the stopping points for inhalation, hold, and exhalation without static circle lines.
            - **🌿 Fluid Organic Botanical Fields**: Dynamic, flowing bamboo leaves, golden lotus petals, and cherry blossom florets that breathe with natural organic motion.
            - **🌑 True Immersive System Blackout**: Tap-to-blackout now completely hides the Android notification status bar and navigation buttons during meditation and breathwork.
            - **📏 Single-Screen Overview & Uniform Chips**: Perfect viewport fitting for the post-session completion reflection screen and uniform sizing for timing chips.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
