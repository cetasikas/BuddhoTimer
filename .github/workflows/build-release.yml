name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.6.0
          name: "Buddho Timer v1.6.0"
          body: |
            ## 🪷 Buddho Meditation Timer v1.6.0
            
            - **📜 Hanji & Sumi-e Zen Aesthetic**: Handcrafted Mulberry Washi paper deckled timer card, Japanese ink wash bamboo artwork background, and carved teal wooden button.
            - **🎨 Organic Watercolor Preset Chips & Enso Track**: Sandstone, clay terracotta, and teal glaze presets with Enso circle step markers.
            - **🔄 Keep It Going Mode**: Explicit toggle for Samadhi Overrun continuous timing past target duration.
            - **🧘 Simple Groundwork-First Instructions**: Lineage-free, step-by-step guidance emphasizing laying the groundwork first (dropping past & future, letting go of the doer) before watching the breath.
            - **⚙️ Clean Navigation & Settings**: Discrete `?` and `⚙️` header access with chimes, auto-DND, and Box Breathing in preferences.
            - **Zero Internet Permissions**: 100% offline, privacy-first meditation tool.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
