name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.0
          name: "Buddho Timer v1.5.0"
          body: |
            ## 🪷 Buddho Meditation Timer v1.5.0
            
            - **🧘 Pure Minimalist Main Timer**: Ultra-clean interface with target duration, quick presets, slider, and direct start.
            - **❓ Quick Instructions Access**: Dedicated `?` header button to open Master Teachings & Instructions (Beginner, Intermediate, Advanced).
            - **⚙️ Complete Meditation Settings**: Dedicated `⚙️` header button for chime sounds, warm-up prep time, auto-DND, and backups.
            - **🫁 Box Breathing in Settings**: Dedicated guided breathwork launcher with realistic blooming flower animation.
            - **🔔 HD Sound Synthesizer**: Tibetan Singing Bowl, Zen Bell, Ting-Sha, Moktak, and Silent Haptic mode.
            - **🌑 Zen OLED Deep Black Mode**: Screen-dimming pitch black mode for evening practice.
            - **Zero Internet Permissions**: 100% offline, battery-efficient, and privacy-first.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
