name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.0
          name: "Buddho Timer v2.5.0"
          body: |
            ## 🪷 Buddho Meditation Timer v2.5.0
            
            - **🔔 Meditation Reminders Outside App**: Added customizable daily (specific hour) and periodic interval reminders with tranquil mindfulness quotes from Buddhist masters to gently invite you into daily stillness.
            - **🪷 Buddhist Wisdom Reflection Card**: 30+ authentic quotes strictly from revered masters (*Ajahn Chah, Thich Nhat Hanh, Ajahn Brahm, Sayadaw U Tejaniya, Shunryu Suzuki, Dalai Lama, Bhante Gunaratana, Eihei Dogen, Luang Pu Mun*) presented on a post-meditation reflection card with tap-to-shuffle.
            - **🌬️ Subtle Breath Pacing Aura**: A gentle, whisper-thin pulsating halo around the circular timer ring oscillating in a soothing 4s in / 4s out cadence to anchor visual awareness.
            - **📍 Milestone Interval Notches**: Luminous milestone notch beads along the circular timer track indicating upcoming periodic mindfulness chimes.
            - **✨ Calmer Leaf Orbit & Luminous White Aura**: Significantly slowed down leaf rotation in Box Breathing for deep serenity and introduced a brilliant, pearlescent white glowing aura with crisp high-contrast veins.
            - **📳 Harmonic Haptic Resonance**: Tiered, subtle tactile vibration profiles for interval bells, session completion, and touch feedback.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
