name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.3.4
          name: "Buddho Timer v2.3.4"
          body: |
            ## 🪷 Buddho Meditation Timer v2.3.4
            
            - **🍃 Calmer, Serene Falling Speed**: Greatly softened the descent speed and rocking motion of falling leaves for a peaceful, tranquil drift during meditation.
            - **🍂 Zero Landing Jerk & Unified Frame Physics**: Directly synchronized horizontal position and drift to eliminate all coordinate jumping/snapping on touchdown.
            - **🪶 Guaranteed Flat Horizontal Resting**: Fixed resting orientation geometry to 90°/270° with natural mound slope alignment so leaves always rest flat on the ground and atop other leaves instead of landing vertically.
            - **🌬️ Silky Smooth Box Breathing Visualizer**: Discontinuity-free continuous phase transitions with living lung physics.
            - **✨ Minimal Unboxed Breathing Typography**: Serene floating typography with clean animated crossfades.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
