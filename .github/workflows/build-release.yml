name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.8.0
          name: "Buddho Timer v2.8.0"
          body: |
            ## 🪷 Buddho Meditation Timer v2.8.0
            
            - **📱 Zero-Scroll Setup Screen Fitting**: Proportions, slider heights, and paddings calibrated to fit perfectly on standard mobile viewports without vertical scrolling.
            - **✨ Clean & Distinct Pattern Selection**: Decluttered dropdown menu with clean 2-line title/summary layout, high-contrast active item glow, and check indicator.
            - **🎋 Revamped Theme Botanical Animations**:
              - *Moonlit Bamboo*: Anchored bamboo stalk with living branch shoots and lanceolate leaves that sprout and unfurl on inhale.
              - *Sacred Lotus*: Asian art composition featuring broad emerald lotus pads and rising slender stems with multi-tiered blooming lotus flowers and buds.
              - *Sakura Twilight*: Flowering cherry blossom bough extending shoots and blooming 5-petal notched florets with stamen glow.
              - *Screen-Bounded Petals*: Drifting ambient leaves and petals gracefully contained within screen boundaries.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
