name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.3.0
          name: "Buddho Timer v2.3.0"
          body: |
            ## 🪷 Buddho Meditation Timer v2.3.0
            
            - **🪷 Warm Golden Lotus & Sandalwood Amber Theme**: Transformed the Lotus atmosphere into an authentic, serene warm temple gold and sandalwood amber aesthetic with floating golden water lily petals.
            - **☕ Ko-fi Donation & Support Integration**: Replaced top cut-off icons with a sleek "Support / Buy Me a Coffee" button linking directly to [ko-fi.com/hackysackapp](https://ko-fi.com/hackysackapp).
            - **🧭 100% Reliable Bottom Navigation**: Instant, seamless 1-tap switching between all 4 tabs (Timer, Wisdom, History, Settings).
            - **⏳ Themed Warm-up Preparation & Zen Box Breathing**: Full atmosphere theming across the preparation countdown ring and box breathing visualizer.
            - **🍂 Deep 5-Tier Progressive Stacking & Graceful Overflow**: Leaves/petals now build up deeply towards the timer during longer sits and gracefully recycle for extended meditation.
            - **100% Offline & Private**: Zero tracking, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
