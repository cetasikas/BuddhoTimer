name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.3.1
          name: "Buddho Timer v2.3.1"
          body: |
            ## 🪷 Buddho Meditation Timer v2.3.1
            
            - **🍃 Fluid Initial Animation & Pure Leaf Particles**: Fixed initial frame rendering for smooth falling leaves upon app launch, and removed all circle glow balls so only authentic theme leaves/petals fall.
            - **🌬️ Zen Miniature Leaf Breathing Visualizer**: Replaced circular breath dots with miniature theme-adaptive leaves & petals that expand, shimmer, and contract with breath cycles.
            - **▶️ Box Breathing Start Button & High-Contrast Readability**: Added dedicated "Begin Breathing Practice" starter button, fixed top close button title overlap, themed the breathing icon, and enhanced legibility for INHALE / HOLD / EXHALE phases.
            - **🪵 Larger Tactile Slider Handle**: Expanded thumb pebble and sprout touch targets for smooth, effortless duration dragging.
            - **☕ Donate Button**: Updated Ko-fi support header label to "Donate" next to the coffee cup icon.
            - **100% Offline & Private**: Zero tracking, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
