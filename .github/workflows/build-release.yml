name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.7.0
          name: "Buddho Timer v1.7.0"
          body: |
            ## 🪷 Buddho Meditation Timer v1.7.0
            
            - **🍃 Plum Village Zen Aesthetic & Moonlit Atmosphere**: Darkened, serene moonlit Sumi-e bamboo atmosphere with high-contrast, luminous typography.
            - **🍂 Interactive Falling Leaves Animation**: Gentle bodhi/bamboo leaves drifting smoothly and fluttering on key actions (starting timer, pausing/resuming, preset selection).
            - **✨ Floating Target Duration**: Large, prominent floating duration display directly on the serene background without heavy cards or washi-paper borders.
            - **💫 Minimalist Slider & Glowing Preset Pills**: Clean horizontal duration slider paired with soft glowing pill-shaped preset buttons (`5m` to `60m`).
            - **🌌 Zen Particle Box Breathing Mode**: Custom particle canvas animation inspired by *"A Thousand Dots, Breathing"* with 400+ glowing warm gold particles expanding, suspending, converging, and resting with organic `easeInOutCubic` easing.
            - **🔲 Minimalist Outline Navigation**: Clean, discrete outline navigation icons across the bottom bar.
            - **Zero Internet Permissions**: 100% offline, privacy-first meditation companion.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
