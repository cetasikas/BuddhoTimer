name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.26.3
          name: "Buddho Timer v2.26.3"
          body: |
            ## 🍃 Buddho Meditation Timer v2.26.3

            ### Leaf Stacking — Overlap & Brightness Fix
            - **No more leaves sitting inside each other**: Leaves snap to ~15 fixed columns across the screen. Two leaves landing simultaneously can never compute the same resting position.
            - **Clean vertical stacks**: Each column builds upward with a proper leaf-height step — no horizontal overlap between adjacent columns, no vertical merging within a column.
            - **No brightness hotspots**: Eliminating positional overlap removes alpha accumulation that was causing bright patches in the pile.
            - **Same-frame collision fix**: Settling leaves are included in the position snapshot so concurrent arrivals don't stack on the same spot.

            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
