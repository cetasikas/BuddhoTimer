name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.5
          name: "Buddho Timer v2.5.5"
          body: |
            ## 🪷 Buddho Meditation Timer v2.5.5
            
            - **🍃 Dynamic Full-Screen Swirling Leaves Background**: Scrubbing the duration sliders on both meditation and breathwork setup screens now triggers subtle, organic full-screen swirling vortex motions in the background leaves, bringing tactile zen responsiveness to life.
            - **🔽 Compact Box Breathing Setup Dropdown**: Replaced pattern cards with a sleek, 1-row dropdown menu selector on the setup screen so the entire Box Breathing configuration effortlessly fits on a single screen without scrolling.
            - **🔄 On-the-Fly Breath Pattern Switching**: Added a top interactive dropdown pill in active breathwork sessions, allowing instantaneous switching between *Box 4-4-4-4, 4-7-8 Deep Calm, Coherence 5-5, and Gentle Box 3-3-3-3* mid-session.
            - **📝 Unified Post-Session Reflection Overview**: Box breathing sessions now seamlessly navigate to the full Session Overview & Reflection screen upon completion (showing mindful quotes, mood selection, journal notes, and saving to history).
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
