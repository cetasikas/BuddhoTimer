name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.26.0
          name: "Buddho Timer v2.26.0"
          body: |
            ## 🍃 Buddho Meditation Timer v2.26.0

            ### Falling Leaves Overhaul
            - **Smaller, more natural leaves**: Reduced leaf size from 28–38dp → 14–22dp for a realistic forest-floor feel
            - **Timer-aware stacking**: Leaves now pile up *around* the circular timer (not into it) using live `onGloballyPositioned` measurement — works on all screen sizes/densities automatically
            - **Curved exclusion boundary**: The stacking floor follows the timer's arc so leaves settle on the outer rim and build outward naturally
            - **App minimize persistence**: Resuming the app no longer causes a leaf position jump — dt is capped and reset correctly on each resume
            - **Summary screen consistency**: Pre-seeded leaf pile on the session summary screen respects the same stacking physics

            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
