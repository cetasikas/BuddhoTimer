name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.26.4
          name: "Buddho Timer v2.26.4"
          body: |
            ## 🍃 Buddho Meditation Timer v2.26.4

            ### UI Polish
            - **Reminder chips no longer cramp**: Mode selector (Daily Fixed / Random / Interval) uses FlowRow — chips flow naturally and text is never truncated
            - **Background Execution button fixed**: "Disable" text no longer gets clipped — button uses wrap-content height with proper padding
            - **Tutorial card button compact**: Open button in Settings → Tutorial row is a tight 34dp height, not oversized
            - **Setup wizard refreshed**: Cleaner, more concise copy across all 3 steps — what the app is, what the features do, why the permissions matter
            - **Meditation guides clearer**: All 6 practice guides rewritten with shorter, punchier, more actionable steps — easier to read on a phone screen

            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
