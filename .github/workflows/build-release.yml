name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.25.1
          name: "Buddho Timer v2.25.1"
          body: |
            ## 🪷 Buddho Meditation Timer v2.25.1
            
            - **🍃 Pure Real-Time Gravity Stacking**:
              - Ground leaves now appear strictly as airborne leaves physically reach the forest floor (zero premature ground spawns).
              - Added real angle of repose physics: leaves roll and slide naturally into lower crevices when landing on elevated pile peaks.
            - **✨ Dynamic Altitude-Based Transparency**:
              - Ground-level resting leaves are rich and solid, while higher stacked leaves gradually transition into soft, translucent layers (`alpha ~ 0.28`), ensuring the pile never obstructs or distracts from the timer and meditation controls.
            - **🔑 Universal Permanent Signing Keystore**:
              - Permanent release keystore ensures all future updates install directly over existing versions.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
