name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.3.7
          name: "Buddho Timer v2.3.7"
          body: |
            ## 🪷 Buddho Meditation Timer v2.3.7
            
            - **📚 Wisdom Guides Collapsed by Default & State Preservation**: Meditation guide topics are now collapsed by default upon opening, and the user's opened/collapsed topic state is automatically persisted across app sessions and restarts.
            - **🌌 Hypnotic Particle-Based Box Breathing Visualizers**:
              - *Bamboo Teal*: Bioluminescent stream particles flowing upwards like vital energy sap along 3 curving bamboo stalks, with glowing node rings and breathing canopy leaf constellations.
              - *Sacred Lotus*: 180-particle sacred geometry mandala blooming in golden amber light on Inhale, and bursting into an ethereal swirling cosmic stardust nebula vortex on Exhale.
              - *Sakura Twilight*: 160 glowing cherry blossom particles & rotating petal blades orbiting in Fibonacci golden spirals, expanding on Inhale and swirling into a whirlpool vortex on Exhale.
            - **🖤 AMOLED Black & Offline Simplicity**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
