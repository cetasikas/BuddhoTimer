name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "Buddho Timer v1.2.0"
          body: |
            ## 🪷 Buddho Meditation Timer v1.2.0
            
            - **🫁 Box Breathing Mode**: Dedicated anxiety and panic reset tool with real-time expanding/contracting radial visualizer, tactile haptic phase pulses, and preset protocols (*Box 4-4-4-4, 4-7-8 Deep Calm, Coherence 5-5, Gentle Box 3-3-3-3*).
            - **🧘 Teachings & Mantras Module**: 100% offline guidance from Ajahn Chah, Ajahn Lee, Ajahn Brahm, Thich Nhat Hanh, Mingyur Rinpoche, Bhante Gunaratana, and the Buddho Mantra.
            - **🪷 Pre-Session Wisdom Card**: Rotatable daily contemplations on the Timer screen.
            - **🔔 HD Sound Synthesizer**: Multi-harmonic Tibetan Singing Bowl, Zen Bronze Bell, Ting-Sha Cymbals, Woodblock Moktak, and Silent Retreat (Haptic Only) mode.
            - **🌑 Zen OLED Deep Black Ambient Mode**: Pitch-black distraction-free clock display for night sits.
            - **Zero Internet Permissions**: 100% offline and privacy-first.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
