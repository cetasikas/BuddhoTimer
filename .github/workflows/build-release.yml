name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.6
          name: "Buddho Timer v2.5.6"
          body: |
            ## 🪷 Buddho Meditation Timer v2.5.6
            
            - **🍃 Real-Time Slider Swirling Wind Physics**: Hooked real-time slider drag velocities and scrubbing directly to the particle engine with 26 ambient leaves, creating immediate, mesmerizing whole-screen swirling vortex motions whenever the branch slider or presets are adjusted.
            - **📐 Balanced, Proportional Layout**: Eliminated awkward empty whitespace by enlarging the target duration numbers (78sp), expanding preset pill grids, enlarging cards and dropdowns, and harmoniously spacing all setup elements.
            - **🔽 Compact Box Breathing Dropdown Setup**: Full breathwork setup fits cleanly on a single screen with zero scrolling required.
            - **🔄 Mid-Session Breathwork Pattern Switching**: Change breathing patterns on the fly via the top interactive pill.
            - **📝 Unified Post-Session Reflection Overview**: Breathwork sessions seamlessly navigate to full session overview with reflection notes, mood selection, and quote cards.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
