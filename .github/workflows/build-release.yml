name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.1
          name: "Buddho Timer v2.5.1"
          body: |
            ## 🪷 Buddho Meditation Timer v2.5.1
            
            - **🍃 Rich Vibrant Leaf Pigments in Box Breathing**: Enhanced the leaf render pipeline so the true theme pigments (serene moonlit teal, warm lotus amber-gold, midnight sakura blossom) shine through vividly with high saturation, framed by a soft ethereal white edge aura.
            - **✨ Streamlined 3-Step Setup Tour**: Re-architected the initial onboarding overlay into a concise, punchy 3-slide guide highlighting Buddho's newest features (*AMOLED Tap-to-Blackout, Mindfulness Interval Bells, Daily Meditation Reminders, Living Box Breathing, and Curated Buddhist Wisdom*).
            - **🔔 Meditation Reminders Outside App**: Customizable daily and periodic reminders with tranquil quotes to gently invite you into daily stillness.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
