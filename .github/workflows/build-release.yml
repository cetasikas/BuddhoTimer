name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.4
          name: "Buddho Timer v2.5.4"
          body: |
            ## 🪷 Buddho Meditation Timer v2.5.4
            
            - **🌬️ Dedicated Box Breathing Setup Screen**: On the main Timer tab, switching to Box Breathing loads a tailored setup interface with target duration sliders, quick presets (2m–20m), and interactive breathing pattern selector cards (*Box 4-4-4-4, 4-7-8 Deep Calm, Coherence 5-5, Gentle Box 3-3-3-3*).
            - **✨ Minimal, Clutter-Free Active Breathwork Experience**: During active box breathing, all unnecessary menus, selectors, and bottom navigation bars are hidden for pure full-screen visual and mental immersion.
            - **🔽 Bottom Mode Toggle**: Positioned the segmented mode toggle (`[ 🧘 Meditation | 🌬️ Box Breathing ]`) conveniently near the bottom above the primary action button.
            - **📱 Crystal-Clear Settings Naming**: Renamed "Display & Stealth Mode" to **"Display & Screen Timeout"** with clear descriptions for *Tap to Blackout Screen* and *Keep Screen Awake*.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
