name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.3.6
          name: "Buddho Timer v2.3.6"
          body: |
            ## 🪷 Buddho Meditation Timer v2.3.6
            
            - **🖤 Pure AMOLED Black Across All Themes**: Removed busy backdrop images from all themes to feature pure AMOLED black, allowing falling particles and timer accents to shine subtly with maximum contrast and battery savings.
            - **🧘 Pure Stillness Meditation Screen**: Removed all particle animations during active meditation for zero distractions.
            - **🍂 Unified Timer & Overview Particles**: The session overview screen now shares the subtle ambient falling leaves from the timer screen, complete with a gentle autumn wind blow-away exit animation.
            - **🌬️ Theme-Specific Box Breathing Visualizers**:
              - *Bamboo Teal*: A living bamboo plant with articulating nodes and leaves that stretch on inhale and rest on exhale.
              - *Sacred Lotus*: A radiant blooming lotus that blossoms on inhale and disperses into swirling golden particles on exhale.
              - *Sakura Twilight*: An iconic 5-petal cherry blossom with orbiting petals expanding in twilight spirals.
            - **✨ Streamlined Tutorial Overview**: Replaced theme picker in the onboarding tutorial with a comprehensive overview of customizable settings.
            - **100% Offline & Private**: Zero tracking, zero ads, zero internet permissions, built for pure stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
