name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhoTimer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.2.0
          name: "Buddho Timer v2.2.0"
          body: |
            ## 🪷 Buddho Meditation Timer v2.2.0
            
            - **🎨 Multi-Atmosphere Theme Engine**: Switch between 3 curated Plum Village aesthetics:
              - **🎋 Moonlit Bamboo (Zen Teal)**: Reverted to the beloved original moonlit bamboo atmosphere with serene teal/cyan breathing glow and bamboo leaves.
              - **🪷 Sacred Lotus**: Misty night lotus pond with floating petals, rose-gold breathing glow, and radiant lotus accents.
              - **🌸 Sakura Twilight**: Starry cherry blossom canopy with drifting notched sakura petals and ethereal pink-pearl glow.
            - **✨ Initial Startup Theme Selection**: Choose your starting atmosphere directly upon first launch during onboarding, or customize anytime in Settings.
            - **🍂 Rich Progressive Leaf & Petal Accumulation**: Dense 4-tiered floor accumulation (100+ particles) that starts with an immediate resting bed and progressively builds up into a lush mound of leaves/petals as your practice deepens.
            - **🪵 Theme-Adaptive Zen Branch Slider**: Living stem gradients and thumb sprouts adapt seamlessly to your active atmosphere.
            - **100% Offline & Private**: Zero tracking, zero internet permissions, built for deep peace and stillness.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
